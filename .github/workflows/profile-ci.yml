name: Profile CI

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 3 */4 * *'
  workflow_dispatch:

# Least privilege by default; the single job opts in to contents: write.
permissions: {}

# Never let a scheduled run and a push run push to master at the same time.
concurrency:
  group: profile-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install --disable-pip-version-check requests

      - name: Count commits across own repositories
        env:
          # GITHUB_TOKEN is minted per run and never expires — no manual rotation.
          # GH_PAT is optional and only needed to also count private repositories.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import sys
          from datetime import date

          import requests

          pat = os.environ.get("GH_PAT", "").strip()
          token = pat or os.environ["GITHUB_TOKEN"]

          USER = "geminishkv"
          # Derived from the clock so the badges roll over on 1 January by themselves.
          CURRENT_YEAR = date.today().year
          YEARS = (CURRENT_YEAR - 1, CURRENT_YEAR)

          # Only a user-scoped PAT can enumerate private repositories; the built-in
          # GITHUB_TOKEN has no user context, so fall back to the public listing.
          REPOS_URL = (
              "https://api.github.com/user/repos?per_page=100&type=owner"
              if pat
              else f"https://api.github.com/users/{USER}/repos?per_page=100&type=owner"
          )
          print(f"Auth: {'GH_PAT' if pat else 'GITHUB_TOKEN (public repositories only)'}")

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })

          def get(url, **kwargs):
              resp = session.get(url, timeout=30, **kwargs)
              if resp.status_code == 401:
                  sys.exit(
                      "Token rejected (401). If GH_PAT is set it is invalid, revoked or "
                      "expired — delete the secret to fall back to GITHUB_TOKEN."
                  )
              if resp.status_code == 403 and resp.headers.get("X-RateLimit-Remaining") == "0":
                  sys.exit("GitHub API rate limit exhausted.")
              return resp

          def get_repos():
              """Own, non-fork repositories — forks would inflate the numbers."""
              repos = []
              url = REPOS_URL
              while url:
                  resp = get(url)
                  resp.raise_for_status()
                  repos.extend(r["name"] for r in resp.json() if not r["fork"])
                  url = resp.links.get("next", {}).get("url")
              return repos

          def count_commits(repo, year):
              """Commits authored by USER in `repo` during `year`."""
              params = {
                  "author": USER,
                  "since": f"{year}-01-01T00:00:00Z",
                  "until": f"{year}-12-31T23:59:59Z",
                  "per_page": 100,
              }
              url = f"https://api.github.com/repos/{USER}/{repo}/commits"
              total = 0
              while url:
                  resp = get(url, params=params)
                  if resp.status_code in (404, 409):  # missing or empty repository
                      return 0
                  resp.raise_for_status()
                  total += len(resp.json())
                  url = resp.links.get("next", {}).get("url")
                  params = None  # the pagination link already carries the query
              return total

          repos = get_repos()
          data = {f"commits_{year}": 0 for year in YEARS}
          for repo in repos:
              for year in YEARS:
                  data[f"commits_{year}"] += count_commits(repo, year)
          data["updated"] = date.today().isoformat()

          with open("commits.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print(f"Repos: {len(repos)} | " + " | ".join(f"{y}: {data[f'commits_{y}']}" for y in YEARS))
          EOF

      - name: Pull profile data from geminishkv.tech sources
        env:
          SITE_REPO: geminishkv/gpages_intro
          SITE_REF: gpages
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${SITE_REPO}/${SITE_REF}"
          curl -fsSL "${base}/src/i18n/translations.js"    -o "${RUNNER_TEMP}/translations.js"
          curl -fsSL "${base}/src/components/Tools.js"     -o "${RUNNER_TEMP}/Tools.js"

          cat > "${RUNNER_TEMP}/extract.js" << 'EOF'
          // Reads the site's own source of truth so the profile can never drift from
          // geminishkv.tech. Both inputs come from a repository owned by the same user.
          const fs = require('fs');
          const vm = require('vm');

          function sliceLiteral(src, decl) {
            const start = src.indexOf(decl);
            if (start === -1) throw new Error(`declaration not found: ${decl}`);
            const open = src.indexOf('[', start);
            let depth = 0;
            for (let i = open; i < src.length; i++) {
              const c = src[i];
              if (c === '[') depth++;
              else if (c === ']' && --depth === 0) return src.slice(open, i + 1);
            }
            throw new Error(`unbalanced literal: ${decl}`);
          }

          const trSrc = fs.readFileSync(process.argv[2], 'utf8')
            .replace('export const translations', 'const translations');
          const ctx = { process: { env: { PUBLIC_URL: '' } }, module: { exports: {} } };
          vm.createContext(ctx);
          vm.runInContext(trSrc + '\nmodule.exports = translations;', ctx);
          const en = ctx.module.exports.en;

          const toolsSrc = fs.readFileSync(process.argv[3], 'utf8');
          const toolCtx = vm.createContext({});
          const TOOL_GROUPS = vm.runInContext(sliceLiteral(toolsSrc, 'const TOOL_GROUPS'), toolCtx);

          const out = {
            experience: en.experience.map((e) => ({
              period: e.period,
              role: e.role,
              companies: e.logos
                ? e.logos.map((l) => ({ name: l.alt, url: l.url }))
                : [{ name: e.company, url: e.url }],
            })),
            projects: en.projects.map((p) => ({
              name: p.name, desc: p.desc, lang: p.lang, url: p.url,
            })),
            toolGroups: TOOL_GROUPS.map((g) => ({
              label: g.label, items: g.items.map((i) => i[0]),
            })),
          };

          for (const [key, value] of Object.entries(out)) {
            if (!Array.isArray(value) || value.length === 0) {
              throw new Error(`extracted "${key}" is empty — the site source layout changed`);
            }
          }
          console.log(JSON.stringify(out, null, 2));
          EOF

          node "${RUNNER_TEMP}/extract.js" \
            "${RUNNER_TEMP}/translations.js" \
            "${RUNNER_TEMP}/Tools.js" > "${RUNNER_TEMP}/site-data.json"

          python3 -c "import json,os;d=json.load(open(os.environ['RUNNER_TEMP']+'/site-data.json'));print('Synced: %d roles, %d projects, %d tool groups'%(len(d['experience']),len(d['projects']),len(d['toolGroups'])))"

      - name: Generate Markdown table from YAML
        id: table
        uses: gazab/create-markdown-table@6686233d7008e8d8b9d4bbdbfd1fb1ae510019f0 # v1.0.7
        with:
          file: ./certs.yaml
          columns: '["ContentId","Area","PageTitle","MetaDescription"]'

      - name: Render generated blocks in readme
        env:
          # Passed through the environment, never interpolated into the shell.
          TABLE: ${{ steps.table.outputs.table }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import pathlib
          import re

          COMMITS_JSON = (
              "https://raw.githubusercontent.com/geminishkv/geminishkv/master/commits.json"
          )

          certs_table = os.environ["TABLE"].strip()
          if not certs_table:
              raise SystemExit("Generated certificates table is empty — check certs.yaml")

          site = json.loads(
              pathlib.Path(os.environ["RUNNER_TEMP"], "site-data.json").read_text("utf-8")
          )
          commits = json.loads(pathlib.Path("commits.json").read_text("utf-8"))

          def cell(text):
              return str(text).replace("|", "\\|")

          def link(name, url):
              return f"[{cell(name)}]({url})" if url else cell(name)

          def table(header, rows):
              head = "| " + " | ".join(header) + " |"
              sep = "| " + " | ".join("---" for _ in header) + " |"
              return "\n".join([head, sep, *rows])

          experience = table(
              ["Period", "Company", "Role"],
              [
                  "| {} | {} | {} |".format(
                      cell(e["period"]),
                      " / ".join(link(c["name"], c.get("url")) for c in e["companies"]),
                      cell(e["role"]),
                  )
                  for e in site["experience"]
              ],
          )

          projects = table(
              ["Project", "Description", "Stack"],
              [
                  "| {} | {} | {} |".format(
                      link(p["name"], p["url"]), cell(p["desc"]), cell(p["lang"])
                  )
                  for p in site["projects"]
              ],
          )

          toolchain = table(
              ["Area", "Tools"],
              [
                  "| {} | {} |".format(cell(g["label"]), " · ".join(map(cell, g["items"])))
                  for g in site["toolGroups"]
              ],
          )

          # Badge labels carry the year, so they are regenerated from commits.json
          # instead of being hardcoded — nothing to edit every January.
          years = sorted(
              int(k.rsplit("_", 1)[1]) for k in commits if re.fullmatch(r"commits_\d{4}", k)
          )
          badges = "\n".join(
              f"![Commits {y}](https://img.shields.io/badge/dynamic/json"
              f"?url={COMMITS_JSON}&label=Commits%20{y}&query=commits_{y}"
              f"&color=2448a2&cacheSeconds=300)"
              for y in years
          )

          blocks = {
              "COMMIT-BADGES": badges,
              "EXPERIENCE": experience,
              "PROJECTS": projects,
              "TOOLCHAIN": toolchain,
              "CERTS": f"\n---\n\n### Certificates\n\n{certs_table}\n",
          }

          readme = pathlib.Path("readme.md")
          content = readme.read_text(encoding="utf-8")

          for name, body in blocks.items():
              start, end = f"<!-- {name}-START -->", f"<!-- {name}-END -->"
              pattern = re.compile(
                  re.escape(start) + r".*?" + re.escape(end), re.DOTALL
              )
              if not pattern.search(content):
                  raise SystemExit(f"Marker pair for {name} is missing from readme.md")
              replacement = f"{start}\n{body}\n{end}"
              content = pattern.sub(lambda _: replacement, content, count=1)

          readme.write_text(content, encoding="utf-8")
          print("Rendered blocks: " + ", ".join(blocks))
          EOF

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: refresh commit stats and certificates (${{ github.ref_name }})"
          file_pattern: 'commits.json readme.md'
